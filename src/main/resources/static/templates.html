<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Supply Chain — Productos (Templates)</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<header class="topbar">
    <h1>Productos</h1>
    <nav>
        <a href="/index.html">Login</a> ·
        <a href="/register.html">Registrar usuario</a> ·
        <button id="logout" type="button" data-testid="logout">Salir</button>
    </nav>
</header>

<main>
    <section class="card">
        <h2>Nuevo producto</h2>
        <form id="tpl-form" autocomplete="off">
            <label>Nombre
                <input type="text" data-testid="tpl-nombre" id="tpl-nombre" maxlength="200" required />
            </label>
            <label>Temporada
                <input type="text" data-testid="tpl-temporada" id="tpl-temporada" maxlength="50" />
            </label>
            <label>Proveedor
                <input type="text" data-testid="tpl-proveedor" id="tpl-proveedor" maxlength="150" />
            </label>
            <label>Precio base
                <input type="number" step="0.01" min="0" data-testid="tpl-precio" id="tpl-precio" />
            </label>
            <label>Categoría
                <select data-testid="tpl-categoria" id="tpl-categoria" required>
                    <option value="">— Elegir —</option>
                </select>
            </label>
            <button type="submit" data-testid="tpl-crear">Crear</button>
        </form>
        <p class="msg" data-testid="tpl-toast" hidden></p>
    </section>

    <section class="card">
        <h2>Catálogo</h2>
        <table data-testid="tpl-table">
            <thead>
            <tr>
                <th>Nombre</th><th>Temporada</th><th>Proveedor</th><th>Precio</th><th></th>
            </tr>
            </thead>
            <tbody id="tpl-tbody"></tbody>
        </table>
    </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/templates.js"></script>
</body>
</html>
