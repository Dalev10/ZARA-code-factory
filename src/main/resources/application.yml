server:
  # Render (y la mayoría de los hosts) inyectan su propio puerto vía la
  # variable de entorno PORT y esperan que el proceso escuche justo ahí; en
  # local/docker-compose no se define, así que cae al 8080 de siempre.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Solo "health": no se expone ningún otro endpoint de Actuator
        # (env, beans, etc.) — este es público (ver SecurityConfig) porque
        # los health checks del proveedor de hosting no llevan JWT.
        include: health
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: supply-chain-mvp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supplychain_local}
    username: ${SPRING_DATASOURCE_USERNAME:supplychain_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:supplychain_password}
    hikari:
      # El pooler de Supabase (Supavisor, modo session) tiene un límite de
      # conexiones simultáneas por proyecto compartido entre todo lo que se
      # conecte; con un solo Web Service corriendo, no hace falta el máximo
      # de HikariCP (10) — 5 alcanza y deja margen para otros clientes
      # (Studio, scripts, etc.) sin agotar el pool del lado de Supabase.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

  jpa:
    # "validate": Hibernate verifica que las entidades @Entity coincidan con el
    # esquema que Flyway ya aplicó, pero NUNCA modifica el esquema por su cuenta.
    # El esquema es responsabilidad exclusiva de las migraciones versionadas en
    # src/main/resources/db/migration/.
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  cors:
    # Lista separada por comas. No usar "*" porque refresh/logout usan cookies.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8443}
  security:
    jwt:
      # Sin valor por defecto a propósito: un secreto de firma JWT nunca debe
      # tener un fallback embebido en el código fuente público. Se define en
      # .env (local) o como variable de entorno real en cada ambiente.
      secret: ${JWT_SECRET}
      access-token-ttl-minutos: ${JWT_ACCESS_TOKEN_TTL_MINUTOS:15}
      refresh-token-ttl-dias: ${JWT_REFRESH_TOKEN_TTL_DIAS:7}
      # Vida corta a propósito: solo alcanza para que el usuario abra su app TOTP
      # y escriba el código, nunca para usarse como una sesión real.
      mfa-challenge-ttl-minutos: ${JWT_MFA_CHALLENGE_TTL_MINUTOS:5}
    mfa:
      # Clave AES-256 (32 bytes en base64) para cifrar el secreto TOTP en reposo.
      # Igual que el secreto JWT: sin default embebido a propósito.
      encryption-key: ${MFA_ENCRYPTION_KEY}